name: smsrelay3 CI

on:
  push:
    paths:
      - "smsrelay3/android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "smsrelay3/android/**"
      - ".github/workflows/android-ci.yml"

concurrency:
  group: android-ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - name: Make Gradle executable
        run: chmod +x smsrelay3/android/gradlew
      - name: Format
        working-directory: smsrelay3/android
        run: ./gradlew :app:ktlintFormat

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - name: Make Gradle executable
        run: chmod +x smsrelay3/android/gradlew
      - name: Typecheck
        working-directory: smsrelay3/android
        run: ./gradlew :app:compileDebugSources

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - name: Make Gradle executable
        run: chmod +x smsrelay3/android/gradlew
      - name: Lint
        working-directory: smsrelay3/android
        run: ./gradlew :app:lintDebug

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - name: Make Gradle executable
        run: chmod +x smsrelay3/android/gradlew
      - name: Unit tests
        working-directory: smsrelay3/android
        run: ./gradlew :app:testDebugUnitTest

  build:
    runs-on: ubuntu-latest
    needs: [format, typecheck, lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - name: Make Gradle executable
        run: chmod +x smsrelay3/android/gradlew
      - name: Build
        working-directory: smsrelay3/android
        run: ./gradlew :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smsrelay3-debug-apk
          path: smsrelay3/android/app/build/outputs/apk/debug/app-debug.apk
