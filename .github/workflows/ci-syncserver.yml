name: syncserver CI

on:
  pull_request:
    paths:
      - "syncserver/**"
      - ".github/workflows/ci-syncserver.yml"
  push:
    branches: [master, main]
    paths:
      - "syncserver/**"
      - ".github/workflows/ci-syncserver.yml"

concurrency:
  group: ci-syncserver-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            syncserver/target
          key: ${{ runner.os }}-syncserver-${{ hashFiles('syncserver/Cargo.lock') }}
      - name: fmt
        working-directory: syncserver
        run: cargo fmt -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            syncserver/target
          key: ${{ runner.os }}-syncserver-${{ hashFiles('syncserver/Cargo.lock') }}
      - name: clippy
        working-directory: syncserver
        run: cargo clippy --all-targets -- -D warnings

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            syncserver/target
          key: ${{ runner.os }}-syncserver-${{ hashFiles('syncserver/Cargo.lock') }}
      - name: check
        working-directory: syncserver
        run: cargo check --all-targets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            syncserver/target
          key: ${{ runner.os }}-syncserver-${{ hashFiles('syncserver/Cargo.lock') }}
      - name: test
        working-directory: syncserver
        run: cargo test --all-targets

  build:
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            syncserver/target
          key: ${{ runner.os }}-syncserver-${{ hashFiles('syncserver/Cargo.lock') }}
      - name: build container
        run: docker build -f syncserver/Dockerfile syncserver -t syncserver:ci
      - name: vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: syncserver:ci
          format: table
          exit-code: 0

  package:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
