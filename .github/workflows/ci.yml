name: smsgate2 CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun run format

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun run build

  package:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f smsgate2/Dockerfile smsgate2 -t smsgate2:ci
      - run: docker run --rm smsgate2:ci bun --version
      - run: docker compose -f docker-compose.yml config

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps
      - run: bun run test:e2e

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: npm audit --audit-level=high
