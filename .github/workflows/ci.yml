name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun run format

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun run build

  package:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f smsgate2/Dockerfile smsgate2 -t smsgate2:ci
      - run: docker run --rm smsgate2:ci bun --version
      - run: docker compose -f docker-compose.yml config

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps
      - run: bun run test:e2e

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smsgate2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: npm audit --audit-level=high

  syncserver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            syncserver/target
          key: ${{ runner.os }}-syncserver-${{ hashFiles('syncserver/Cargo.lock') }}
      - name: fmt
        working-directory: syncserver
        run: cargo fmt -- --check
      - name: clippy
        working-directory: syncserver
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: syncserver
        run: cargo test --all-targets
      - name: build container
        run: docker build -f syncserver/Dockerfile syncserver -t syncserver:ci
      - name: vulnerability scan
        uses: aquasecurity/trivy-action@0.22.0
        with:
          image-ref: syncserver:ci
          format: table
          exit-code: 0

  smsrelay3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - name: Make Gradle executable
        run: chmod +x smsrelay3/android/gradlew
      - name: ktlint
        working-directory: smsrelay3/android
        run: ./gradlew ktlintCheck
      - name: lint
        working-directory: smsrelay3/android
        run: ./gradlew lintDebug
      - name: unit tests
        working-directory: smsrelay3/android
        run: ./gradlew testDebugUnitTest
      - name: assemble
        working-directory: smsrelay3/android
        run: ./gradlew assembleDebug

  stack:
    runs-on: ubuntu-latest
    needs: [build, syncserver, smsrelay3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - name: Make scripts executable
        run: chmod +x scripts/ci-all.sh smsrelay3/android/gradlew
      - name: Run full stack checks
        run: ./scripts/ci-all.sh
