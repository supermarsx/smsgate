version: "3.9"

services:
  smsgate2:
    build:
      context: ./smsgate2
    env_file:
      - ./smsgate2/.env.example
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://syncserver:4000/api/v1
      NEXT_PUBLIC_WS_ORIGIN: http://syncserver:4000
      NEXT_PUBLIC_WS_PATH: /api/v1/ws
    volumes:
      - ./smsgate2/config:/app/config:ro
      - ./smsgate2/locales:/app/locales:ro
    ports:
      - "3000:3000"
    depends_on:
      - syncserver
      - redis
      - db

  syncserver:
    build:
      context: ./syncserver
    environment:
      SYNC_PORT: 4000
      SYNC_HOST: 0.0.0.0
      SYNC_CONFIG_PATH: /app/config/config.json
      SYNC_HOTSTORE: redis
      SYNC_REDIS_URL: redis://redis:6379
      SYNC_DB_ADAPTER: postgres
      SYNC_DB_URL: postgres://syncserver:syncserver@db:5432/syncserver
    volumes:
      - ./syncserver/config:/app/config:ro
    ports:
      - "4000:4000"
    depends_on:
      - redis
      - db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: syncserver
      POSTGRES_USER: syncserver
      POSTGRES_DB: syncserver
    ports:
      - "5432:5432"
