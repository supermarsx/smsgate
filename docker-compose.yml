version: "3.9"

services:
  smsgate2:
    build:
      context: ./smsgate2
    env_file:
      - ./smsgate2/.env.example
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://syncserver:4000/api/v1
      NEXT_PUBLIC_WS_ORIGIN: http://syncserver:4000
      NEXT_PUBLIC_WS_PATH: /api/v1/ws
    volumes:
      - ./smsgate2/config:/app/config:ro
      - ./smsgate2/locales:/app/locales:ro
    ports:
      - "3000:3000"
    depends_on:
      - syncserver
      - redis
      - db

  syncserver:
    image: ghcr.io/wiremock/wiremock:3.5.4
    ports:
      - "4000:4000"
    command: ["--port", "4000", "--global-response-templating"]
    volumes:
      - ./docs/mock-syncserver:/home/wiremock

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: syncserver
      POSTGRES_USER: syncserver
      POSTGRES_DB: syncserver
    ports:
      - "5432:5432"
