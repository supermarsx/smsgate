plugins {
    id "com.android.application"
    id "kotlin-android"
    id "kotlin-kapt"
    id "org.jlleitschuh.gradle.ktlint" version "10.2.0"
}

def buildConfigProps = new Properties()
def buildConfigPath = project.findProperty("smsrelayBuildConfig") ?: "build-config.properties"
def buildConfigFile = file(buildConfigPath)
if (buildConfigFile.exists()) {
    buildConfigFile.withInputStream { stream -> buildConfigProps.load(stream) }
}

def propString = { key, defaultValue = null ->
    buildConfigProps.getProperty(key, defaultValue)
}

def propBool = { key, defaultValue ->
    (buildConfigProps.getProperty(key) ?: defaultValue.toString()).toString().toBoolean()
}

def propList = { key ->
    buildConfigProps.getProperty(key, "")
        .split(",")
        .collect { it.trim() }
        .findAll { it }
}

android {
    namespace = "com.smsrelay3"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.smsrelay3"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        def configRes = propList("resConfigs")
        if (!configRes.isEmpty()) {
            resConfigs configRes
        }
    }

    def releaseSigningConfigured = false
    signingConfigs {
        release {
            def storeFilePath = propString("signing.storeFile")
            if (storeFilePath) {
                def store = file(storeFilePath)
                if (store.exists()) {
                    storeFile store
                    storePassword propString("signing.storePassword", "")
                    keyAlias propString("signing.keyAlias", "")
                    keyPassword propString("signing.keyPassword", "")
                    releaseSigningConfigured = true
                }
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled propBool("release.minifyEnabled", false)
            shrinkResources propBool("release.shrinkResources", false)
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    splits {
        abi {
            def abis = propList("splits.abi")
            enable !abis.isEmpty()
            reset()
            if (!abis.isEmpty()) {
                include(*abis)
            }
        }
        density {
            def densities = propList("splits.density")
            enable !densities.isEmpty()
            reset()
            if (!densities.isEmpty()) {
                include(*densities)
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "androidx.appcompat:appcompat:1.3.1"
    implementation "androidx.core:core-ktx:1.7.0"
    implementation "androidx.activity:activity-ktx:1.7.2"
    implementation "androidx.constraintlayout:constraintlayout:2.1.3"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "androidx.preference:preference-ktx:1.1.1"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.work:work-runtime-ktx:2.7.1"
    implementation "androidx.security:security-crypto:1.1.0-alpha03"
    implementation "androidx.room:room-runtime:2.7.0"
    implementation "androidx.room:room-ktx:2.7.0"
    kapt "androidx.room:room-compiler:2.7.0"
    implementation "com.google.android.material:material:1.4.0"
    implementation "com.squareup.okhttp3:okhttp:4.9.3"
    implementation "androidx.camera:camera-core:1.4.0"
    implementation "androidx.camera:camera-camera2:1.4.0"
    implementation "androidx.camera:camera-lifecycle:1.4.0"
    implementation "androidx.camera:camera-view:1.4.0"
    // 18.4.0 not published to Google/Maven Central; stick to latest available 18.3.0
    implementation "com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.test:core:1.4.0"
    testImplementation "org.robolectric:robolectric:4.12.2"
    testImplementation "androidx.work:work-testing:2.7.1"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.9.3"
}
