# Example build-time overrides for smsrelay3 Android.
# Usage: from the android/ dir run:
#   ./gradlew assembleRelease -PsmsrelayBuildConfig=build-config.example.properties

# Signing (optional). Leave blank to keep unsigned release output.
signing.storeFile=keystore/relay-release.jks
signing.storePassword=change_me
signing.keyAlias=relay
signing.keyPassword=change_me

# Release toggles (default false).
release.minifyEnabled=true
release.shrinkResources=true

# Resource configuration filter (comma-separated, optional).
# resConfigs=en,es,pt

# Split APKs (optional, comma-separated). When empty, splits are disabled.
# splits.abi=armeabi-v7a,arm64-v8a,x86_64
# splits.density=xxhdpi,xhdpi,xxxhdpi
