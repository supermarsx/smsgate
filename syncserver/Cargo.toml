[package]
name = "syncserver"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "json", "ws"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
prometheus = { version = "0.13", default-features = false, features = ["process"] }
async-trait = "0.1"
sha2 = "0.10"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
dashmap = "6"
futures = "0.3"
axum-extra = { version = "0.9", features = ["typed-header"] }
headers = "0.4"
redis = { version = "0.25", features = ["aio", "tokio-comp", "connection-manager"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
totp-rs = { version = "5", default-features = true, features = ["otpauth"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros", "any", "sqlite", "postgres", "mysql", "chrono", "uuid", "json", "tls-rustls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
jsonwebtoken = "9"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tower = "0.5"

[profile.dev]
debug = 1
split-debuginfo = "packed"
incremental = false

[profile.test]
debug = 1
split-debuginfo = "packed"
incremental = false
